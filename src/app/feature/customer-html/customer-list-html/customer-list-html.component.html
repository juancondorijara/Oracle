<div style="display: flex; justify-content: center; margin-bottom: 16px;">
  <button class="btn-edit" (click)="reportPdf()">📄 Generar Reporte</button>
</div>

<div class="table-responsive">
  <table class="customer-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>DNI</th>
        <th>Celular</th>
        <th>Nombres</th>
        <th>Apellidos</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let customer of customers">
        <td>{{ customer.id }}</td>
        <td>{{ customer.dni }}</td>
        <td>{{ customer.cellPhone }}</td>
        <td>{{ customer.firstName }}</td>
        <td>{{ customer.lastName }}</td>
        <td>{{ customer.state }}</td>
        <td>
          <button class="btn-edit" (click)="onEdit(customer)">Editar</button>
          <button class="btn-delete" (click)="delete(customer.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
