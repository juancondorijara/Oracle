server:
  port: ${PORT:8085}  # puerto 8085 por defecto si no se define en las variables de entorno

spring:
  datasource:
    url: jdbc:oracle:thin:@developer_medium?TNS_ADMIN=Wallet_developer # host de oracle con Docker
    username: DEVELOPER_01                          # mi usuario creado en oracle
    password: Admin12345678                         # mi contraseña creado en oracle     
    driver-class-name: oracle.jdbc.OracleDriver  # driver de oracle
  jpa:
    hibernate:
      ddl-auto: update   # none | update | create | create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  main:
    allow-bean-definition-overriding: true
